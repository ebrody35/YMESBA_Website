<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — YMESBA</title>
<meta name="description" content="Get in touch with YMESBA at yalemesba@gmail.com.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Contact — YMESBA">
<meta property="og:description" content="Get in touch with YMESBA at yalemesba@gmail.com.">
<meta property="og:image" content="https://www.ymesba.org/images/yale-campus.jpg">
<meta property="og:url" content="https://www.ymesba.org/contact">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body data-page="contact">

<div id="site-header"></div>

<section class="pagehead">
  <div class="wrap">
    <span class="eyebrow mono"><span class="dot"></span>Contact</span>
    <h1>Get in touch.</h1>
    <p>Questions about membership, speakers, or partnerships — we'd love to hear from you.</p>
  </div>
</section>

<section>
  <div class="wrap contact-grid">
    <div class="contact-info">
      <div class="item">
        <span class="mono">Email</span>
        <h3><a href="mailto:yalemesba@gmail.com" style="text-decoration:none;">yalemesba@gmail.com</a></h3>
      </div>
      <div class="item">
        <span class="mono">Membership</span>
        <h3>Open to all Yale College students — no experience required.</h3>
      </div>
    </div>

    <form id="contact-form">
      <div class="form-field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit" class="btn solid">Send message</button>
      <p class="form-status" id="form-status" aria-live="polite"></p>
    </form>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/components.js?v=9"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  emailjs.init({ publicKey: 'Xzkgi5da7f1L3fufH' });

  document.getElementById('contact-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.target;
    var btn = form.querySelector('button[type="submit"]');
    var status = document.getElementById('form-status');

    btn.disabled = true;
    btn.textContent = 'Sending…';
    status.textContent = '';

    emailjs.sendForm('service_o0w6d43', 'template_ievnjix', form)
      .then(function () {
        status.textContent = "Thanks — we'll get back to you soon.";
        status.style.color = 'var(--yale-blue)';
        form.reset();
      })
      .catch(function () {
        status.textContent = 'Something went wrong — please email us directly at yalemesba@gmail.com.';
        status.style.color = '#b3282d';
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = 'Send message';
      });
  });
</script>
</body>
</html>
