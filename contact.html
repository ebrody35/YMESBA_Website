<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — YMESBA</title>
<meta name="description" content="Get in touch with YMESBA at yalemesba@gmail.com.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body data-page="contact">

<div id="site-header"></div>

<section class="pagehead">
  <div class="wrap">
    <span class="eyebrow mono"><span class="dot"></span>Contact</span>
    <h1>Get in touch.</h1>
    <p>Questions about membership, speakers, or partnerships — we'd love to hear from you.</p>
  </div>
</section>

<section>
  <div class="wrap contact-grid">
    <div class="contact-info">
      <div class="item">
        <span class="mono">Email</span>
        <h3><a href="mailto:yalemesba@gmail.com" style="text-decoration:none;">yalemesba@gmail.com</a></h3>
      </div>
      <div class="item">
        <span class="mono">Membership</span>
        <h3>Open to all Yale College students — no experience required.</h3>
      </div>
    </div>

    <form id="contact-form">
      <div class="form-field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <button type="submit" class="btn solid">Send message</button>
    </form>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/components.js"></script>
<script>
  document.getElementById('contact-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = document.getElementById('name').value;
    var email = document.getElementById('email').value;
    var message = document.getElementById('message').value;
    var subject = encodeURIComponent('YMESBA website inquiry from ' + name);
    var body = encodeURIComponent(message + '\n\n— ' + name + ' (' + email + ')');
    window.location.href = 'mailto:yalemesba@gmail.com?subject=' + subject + '&body=' + body;
  });
</script>
</body>
</html>
